<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>វិញ្ញាសាប្រឡងគំរូ — KhmerMath Local Starter</title>
<link rel="stylesheet" href="static/fonts/kantumruy-pro.css">
<link rel="stylesheet" href="static/katex/katex.min.css">
<style>
  :root {
    --primary: #1971c2;
    --primary-hover: #1864ab;
    --primary-light: #e7f5ff;
    --success: #2f9e44;
    --success-light: #ebfbee;
    --danger: #e03131;
    --danger-light: #fff5f5;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #212529;
    --text-muted: #868e96;
    --border: #dee2e6;
    --radius: 12px;
    --font: 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header.topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 1.1rem;
  }
  .brand-back {
    color: var(--primary);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--primary-light);
  }
  .top-status {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .timer-badge {
    background: #fff3bf;
    color: #f08c00;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    border: 1px solid #ffe066;
  }
  .btn-submit {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-family: var(--font);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: var(--primary-hover); }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    max-width: 1100px;
    width: 100%;
    margin: 24px auto;
    padding: 0 16px;
    gap: 24px;
    flex: 1;
  }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
  }

  .sidebar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    height: fit-content;
  }
  .sidebar h3 {
    font-size: 1rem;
    margin-bottom: 12px;
    color: var(--text-muted);
  }
  .grid-nav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .nav-btn {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    font-family: var(--font);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
  .nav-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .nav-btn.answered {
    background: var(--primary-light);
    color: var(--primary);
    border-color: #a5d8ff;
  }
  .nav-btn.active.answered {
    background: var(--primary);
    color: #fff;
  }

  .exam-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .q-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .q-badge {
    background: #e9ecef;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .q-stem {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }
  .opt-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
  }
  .opt-card:hover {
    border-color: #a5d8ff;
    background: #f8faff;
  }
  .opt-card.selected {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .opt-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
  }
  .opt-text {
    font-size: 1.05rem;
    flex: 1;
  }

  .input-calc-box {
    margin-bottom: 32px;
  }
  .input-calc {
    font-family: var(--font);
    font-size: 1.1rem;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    max-width: 300px;
    outline: none;
  }
  .input-calc:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25, 113, 194, 0.15); }

  .q-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .btn-nav {
    background: #e9ecef;
    color: var(--text);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: var(--font);
    font-weight: 600;
    cursor: pointer;
  }
  .btn-nav:hover:not(:disabled) { background: #dee2e6; }
  .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Results Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-card {
    background: #fff;
    border-radius: var(--radius);
    max-width: 650px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .score-circle {
    text-align: center;
    margin: 20px 0;
  }
  .score-num {
    font-size: 3rem;
    font-weight: 800;
    color: var(--primary);
  }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .review-item.correct { border-left: 4px solid var(--success); }
  .review-item.wrong { border-left: 4px solid var(--danger); }
</style>
</head>
<body>

<header class="topbar">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="index.html" class="brand-back">◀ ត្រឡប់ទៅមេ</a>
    <div class="brand">📝 វិញ្ញាសាប្រឡងគំរូ (Local Exam Demo)</div>
  </div>
  <div class="top-status">
    <div class="timer-badge">⏱ <span id="timer-text">15:00</span></div>
    <button class="btn-submit" id="submit-btn" onclick="submitExam()">ប្រគល់វិញ្ញាសា</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <h3>បញ្ជីសំណួរ (Questions)</h3>
    <div class="grid-nav" id="grid-nav"></div>
    <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
      • ចុចលើលេខសំណួរដើម្បីផ្លាស់ទី<br>
      • ពណ៌ខៀវខ្ចី៖ បានឆ្លើយរួច<br>
      • ពណ៌ខៀវចាស់៖ សំណួរបច្ចុប្បន្ន
    </div>
  </aside>

  <section class="exam-box" id="exam-box">
    <div>
      <div class="q-meta">
        <span class="q-badge" id="q-no">សំណួរទី ១</span>
        <span class="q-badge" id="q-level" style="background: #e7f5ff; color: #1971c2;">កម្រិត៖ មធ្យម</span>
      </div>
      <div class="q-stem" id="q-stem">កំពុងផ្ទុកសំណួរ…</div>
      <div id="q-input-area"></div>
    </div>

    <div class="q-actions">
      <button class="btn-nav" id="btn-prev" onclick="prevQ()">◀ ថយក្រោយ</button>
      <button class="btn-nav" id="btn-next" onclick="nextQ()">បន្ទាប់ ▶</button>
    </div>
  </section>
</main>

<div class="modal-overlay" id="result-modal" style="display: none;">
  <div class="modal-card">
    <h2 style="text-align: center;">🎉 លទ្ធផលនៃការប្រឡង</h2>
    <div class="score-circle">
      <div class="score-num" id="score-display">0 / 0</div>
      <p id="score-msg" style="color: var(--text-muted);">សូមពិនិត្យអត្រាកំណែលម្អិតខាងក្រោម</p>
    </div>
    <div id="review-list"></div>
    <div style="text-align: center; margin-top: 24px;">
      <button class="btn-submit" onclick="location.reload()">🔄 ប្រឡងម្តងទៀត</button>
      <a href="index.html" class="brand-back" style="margin-left: 12px; display: inline-block;">ទំព័រដើម</a>
    </div>
  </div>
</div>

<script src="static/katex/katex.min.js"></script>
<script src="static/katex/contrib/auto-render.min.js"></script>
<script>
  var questions = [];
  var currentIndex = 0;
  var userAnswers = {};
  var timeLeft = 15 * 60; // 15 mins
  var timerInterval = null;

  function renderLatex() {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }
  }

  function startTimer() {
    timerInterval = setInterval(function() {
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitExam();
        return;
      }
      timeLeft--;
      var m = Math.floor(timeLeft / 60);
      var s = timeLeft % 60;
      document.getElementById('timer-text').textContent = 
        (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }, 1000);
  }

  fetch('static/data/sample_bank.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      questions = data;
      renderNav();
      showQuestion(0);
      startTimer();
    })
    .catch(function(err) {
      document.getElementById('q-stem').innerHTML = 'មិនអាចទាញទិន្នន័យសំណួរបានទេ៖ ' + err;
    });

  function renderNav() {
    var nav = document.getElementById('grid-nav');
    nav.innerHTML = '';
    questions.forEach(function(q, idx) {
      var btn = document.createElement('button');
      btn.className = 'nav-btn' + (idx === currentIndex ? ' active' : '') + (userAnswers[idx] !== undefined ? ' answered' : '');
      btn.textContent = idx + 1;
      btn.onclick = function() { showQuestion(idx); };
      nav.appendChild(btn);
    });
  }

  function showQuestion(idx) {
    currentIndex = idx;
    var q = questions[idx];
    document.getElementById('q-no').textContent = 'សំណួរទី ' + (idx + 1) + ' នៃ ' + questions.length;
    document.getElementById('q-level').textContent = 'កម្រិត៖ ' + (q.level || 'ទូទៅ');
    document.getElementById('q-stem').innerHTML = q.stem;

    var area = document.getElementById('q-input-area');
    area.innerHTML = '';

    if (q.type === 'mcq' && q.options) {
      var list = document.createElement('div');
      list.className = 'options-list';
      q.options.forEach(function(opt, optIdx) {
        var card = document.createElement('div');
        card.className = 'opt-card' + (userAnswers[idx] === optIdx ? ' selected' : '');
        card.onclick = function() {
          userAnswers[idx] = optIdx;
          showQuestion(idx);
          renderNav();
        };
        var radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'q_opt';
        radio.className = 'opt-radio';
        radio.checked = userAnswers[idx] === optIdx;
        var txt = document.createElement('div');
        txt.className = 'opt-text';
        txt.innerHTML = String.fromCharCode(65 + optIdx) + '. ' + opt;
        card.appendChild(radio);
        card.appendChild(txt);
        list.appendChild(card);
      });
      area.appendChild(list);
    } else {
      // Numerical / Direct input
      var box = document.createElement('div');
      box.className = 'input-calc-box';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'input-calc';
      inp.placeholder = 'វាយលេខចម្លើយរបស់អ្នក…';
      inp.value = userAnswers[idx] !== undefined ? userAnswers[idx] : '';
      inp.oninput = function() {
        if (inp.value.trim() !== '') {
          userAnswers[idx] = inp.value.trim();
        } else {
          delete userAnswers[idx];
        }
        renderNav();
      };
      box.appendChild(inp);
      area.appendChild(box);
    }

    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === questions.length - 1;
    renderNav();
    renderLatex();
  }

  function prevQ() { if (currentIndex > 0) showQuestion(currentIndex - 1); }
  function nextQ() { if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1); }

  function submitExam() {
    if (timerInterval) clearInterval(timerInterval);
    var correctCount = 0;
    var reviewHtml = '';

    questions.forEach(function(q, idx) {
      var ans = userAnswers[idx];
      var isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = ans === q.answer;
      } else {
        isCorrect = String(ans) === String(q.answer);
      }

      if (isCorrect) correctCount++;

      var statusCls = isCorrect ? 'correct' : 'wrong';
      var statusIcon = isCorrect ? '✅ ត្រឹមត្រូវ' : '❌ មិនត្រឹមត្រូវ';

      reviewHtml += '<div class="review-item ' + statusCls + '">' +
        '<strong>សំណួរទី ' + (idx + 1) + '៖ ' + statusIcon + '</strong>' +
        '<div style="margin: 6px 0;">' + q.stem + '</div>' +
        '<div style="font-size: 0.95rem; color: #495057;">' +
        '• ចម្លើយរបស់អ្នក៖ <strong>' + (ans !== undefined ? (q.type === 'mcq' ? q.options[ans] : ans) : 'មិនបានឆ្លើយ') + '</strong><br>' +
        '• ចម្លើយត្រឹមត្រូវ៖ <strong style="color: var(--success);">' + (q.type === 'mcq' ? q.options[q.answer] : q.answer) + '</strong>' +
        '</div>' +
        (q.sol ? '<div style="margin-top: 8px; font-size: 0.9rem; background: #f8f9fa; padding: 8px; border-radius: 6px;">💡 <strong>អត្រាកំណែ៖</strong> ' + q.sol + '</div>' : '') +
        '</div>';
    });

    document.getElementById('score-display').textContent = correctCount + ' / ' + questions.length;
    document.getElementById('review-list').innerHTML = reviewHtml;
    document.getElementById('result-modal').style.display = 'flex';
    renderLatex();
  }
</script>
</body>
</html>
